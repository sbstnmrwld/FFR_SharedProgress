plugin.name = 成長の共有
plugin.description = 加入済みのキャラクターが最も成長したキャラクターのレベルに揃い、全ビジョンのシンクロマスタリーが最も高いビジョンに揃います。値は上がるだけで、セーブデータに残ります。
Exp.label = 経験値を共有
Exp.help = 戦闘後とロード時に、加入済みの全キャラクターを最も成長したキャラクターのレベルまで引き上げます。セーブデータに残ります。
Synchro.label = ビジョンのシンクロを共有
Synchro.help = 戦闘後とロード時に、全ビジョンのシンクロマスタリーを全キャラクターで最も高いビジョンのポイントまで引き上げます。セーブデータに残ります。
