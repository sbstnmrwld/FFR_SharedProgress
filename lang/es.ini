plugin.name = Progreso compartido
plugin.description = Los personajes que se han unido alcanzan el nivel del más avanzado, y todas las visiones igualan a la mejor en maestría de sincronía. Los valores solo suben y se quedan en la partida guardada.
Exp.label = Compartir EXP
Exp.help = Tras cada combate y al cargar, cada personaje que se ha unido sube al nivel del más avanzado. Se queda en la partida guardada.
Synchro.label = Compartir sincronía de visiones
Synchro.help = Tras cada combate y al cargar, la maestría de sincronía de todas las visiones sube para todos los personajes a los puntos más altos de una visión. Se queda en la partida guardada.
