plugin.name = Gemeinsamer Fortschritt
plugin.description = Beigetretene Charaktere erreichen das Level des am weitesten fortgeschrittenen, und alle Visionen ziehen bei der Synchro-Meisterung mit der besten gleich. Werte steigen nur und bleiben im Spielstand.
Exp.label = EXP teilen
Exp.help = Nach jedem Kampf und beim Laden wird jeder beigetretene Charakter auf das Level des am weitesten fortgeschrittenen angehoben. Bleibt dauerhaft im Spielstand.
Synchro.label = Visions-Synchro teilen
Synchro.help = Nach jedem Kampf und beim Laden wird die Synchro-Meisterung aller Visionen bei allen Charakteren auf die höchsten Punkte einer Vision angehoben. Bleibt dauerhaft im Spielstand.
