plugin.name = 성장 공유
plugin.description = 합류한 캐릭터가 가장 많이 성장한 캐릭터의 레벨에 맞춰지고, 모든 비전의 싱크로 마스터리가 가장 높은 비전에 맞춰집니다. 값은 오르기만 하며 세이브 데이터에 남습니다.
Exp.label = 경험치 공유
Exp.help = 전투 후와 로드 시, 합류한 모든 캐릭터를 가장 많이 성장한 캐릭터의 레벨까지 올립니다. 세이브 데이터에 남습니다.
Synchro.label = 비전 싱크로 공유
Synchro.help = 전투 후와 로드 시, 모든 비전의 싱크로 마스터리를 모든 캐릭터에게 가장 높은 비전의 포인트까지 올립니다. 세이브 데이터에 남습니다.
