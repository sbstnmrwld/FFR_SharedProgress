plugin.name = Progression partagée
plugin.description = Les personnages ayant rejoint l'équipe atteignent le niveau du plus avancé, et toutes les visions rattrapent la meilleure en maîtrise de synchro. Les valeurs ne font qu'augmenter et restent dans la sauvegarde.
Exp.label = Partager l'EXP
Exp.help = Après chaque combat et au chargement, chaque personnage ayant rejoint l'équipe est porté au niveau du plus avancé. Reste dans la sauvegarde.
Synchro.label = Partager la synchro des visions
Synchro.help = Après chaque combat et au chargement, la maîtrise de synchro de toutes les visions est portée pour tous les personnages aux points les plus élevés d'une vision. Reste dans la sauvegarde.
